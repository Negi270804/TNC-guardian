# Render Blueprint definition for TNC Guardian project
# To deploy: connect the Git repository to Render and use the Blueprint option.

services:
  # 1. FastAPI Python/Docker Backend
  - type: web
    name: tnc-guardian-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free # Deploys on Render's free tier
    envVars:
      - key: DATABASE_URL
        sync: false # User will provide Neon database URL in Render UI
      - key: JWT_SECRET
        sync: false # User will generate a secure JWT signing key
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000

  # 2. React SPA Static Frontend
  - type: static
    name: tnc-guardian-frontend
    env: static
    buildCommand: cd frontend && npm install --include=dev && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false # Deployed backend API gateway URL (e.g. https://tnc-guardian-backend.onrender.com/api)
      - key: VITE_APP_NAME
        value: TNC Guardian
      - key: VITE_ENV
        value: production
      - key: VITE_ENABLE_DEMO_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
